<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- noindex: painel privado, nao deve aparecer no Google -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">

<title>Painel · Giovanna Carrilho</title>
<meta name="theme-color" content="#4A2028">

<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================================
   PAINEL  ·  mesmas cores e mesmo arredondamento do portfolio.
   A letra aqui e a Inter, desenhada para tela, em tamanhos confortaveis.
   O site continua com a Archivo, que e a letra da marca.
   ============================================================================ */
:root{
  --vinho:#4A2028;
  --vinho-d:#331319;
  --laranja:#B45F2B;
  --terra:#C89078;
  --oliva:#545A34;
  --lousa:#A3BACB;
  --ocre:#C9A227;
  --cacau:#6B4433;
  --creme:#F5F0E6;
  --creme2:#EFE9DC;
  --white:#FFF;
  --vermelho:#9B2A2A;

  --ink:#4A2028;
  --soft:rgba(74,32,40,.76);
  --faint:rgba(74,32,40,.48);
  --mudo:rgba(74,32,40,.3);
  --linha:rgba(74,32,40,.13);
  --linha2:rgba(74,32,40,.07);

  --disp:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;

  --rad:18px;      /* cartoes */
  --rad-s:11px;    /* campos e botoes quadrados */
  --rad-p:100px;   /* pilulas, igual ao portfolio */

  --menu:252px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--disp);background:var(--creme);color:var(--ink);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
::selection{background:var(--ocre);color:var(--vinho)}
img{display:block;max-width:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--laranja)}
svg{display:block;flex:none}

/* --- a pagina so aparece depois da conferencia da sessao ------------------- */
#app{display:none}
body.liberado #app{display:block}
#checando{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--creme);color:var(--faint);font-size:14.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;z-index:999;text-align:center;padding:24px;
}
body.liberado #checando{display:none}

/* ========================= MENU LATERAL ================================== */
.menu{
  position:fixed;left:0;top:0;bottom:0;width:var(--menu);z-index:80;
  background:var(--vinho);color:rgba(245,240,230,.9);
  display:flex;flex-direction:column;padding:22px 0 0;
}
.menu-topo{padding:0 20px 20px}
.menu-marca{
  font-weight:800;font-size:12px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--ocre);
}
.menu-nome{font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--creme);margin-top:3px}

.menu-corpo{flex:1;overflow-y:auto;padding:4px 10px 12px}
.menu-secao{
  font-weight:700;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(245,240,230,.36);padding:16px 10px 7px;
}
.menu-item{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:none;cursor:pointer;text-align:left;
  padding:9px 10px;border-radius:var(--rad-s);
  color:rgba(245,240,230,.76);font-size:15px;font-weight:600;
  border-left:3px solid transparent;transition:background .14s,color .14s;
}
.menu-item:hover{background:rgba(245,240,230,.07);color:var(--creme)}
/* item ativo: fundo suave da cor principal, sem inverter para preto */
.menu-item.ativo{
  background:rgba(245,240,230,.14);color:var(--creme);
  border-left-color:var(--ocre);
}
.menu-item svg{stroke:currentColor;opacity:.85}

.menu-pe{padding:14px 18px 16px;border-top:1px solid rgba(245,240,230,.13)}
.menu-email{
  font-size:13px;color:rgba(245,240,230,.52);word-break:break-all;margin-bottom:10px;
  line-height:1.35;
}
.btn-sair{
  display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  background:rgba(245,240,230,.1);border:1px solid rgba(245,240,230,.18);
  color:var(--creme);font-size:14px;font-weight:700;
  padding:9px;border-radius:var(--rad-p);cursor:pointer;transition:background .14s;
}
.btn-sair:hover{background:rgba(245,240,230,.18)}
.btn-sair svg{stroke:currentColor}

.menu-fundo{display:none}
.btn-menu{display:none}

/* ============================ CONTEUDO =================================== */
.conteudo{margin-left:var(--menu);min-height:100vh;padding:0 0 60px}
.topo{
  position:sticky;top:0;z-index:50;background:rgba(245,240,230,.93);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--linha);
  padding:16px 26px;display:flex;align-items:center;gap:12px;
}
.topo h1{font-weight:800;font-size:21px;letter-spacing:-.03em;line-height:1.1}
.topo .dica{font-size:14px;color:var(--faint);margin-top:1px}
.bloco{padding:22px 26px 0}

.avisos{margin:0 26px 18px;display:none}
.avisos.tem{display:block}
.aviso{
  background:rgba(201,162,39,.13);border:1px solid rgba(201,162,39,.4);
  border-radius:var(--rad-s);padding:11px 14px;font-size:14.5px;color:#7A5F12;
  margin-bottom:8px;line-height:1.5;
}
.aviso b{color:#5E4A0D}

/* ============================== CARTOES ================================== */
.cartao{
  background:var(--white);border:1px solid var(--linha);
  border-radius:var(--rad);overflow:hidden;margin-bottom:20px;
}
.cartao-topo{
  padding:14px 18px;border-bottom:1px solid var(--linha2);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.cartao-tit{font-weight:800;font-size:15px;letter-spacing:-.01em}
.cartao-sub{font-size:13.5px;color:var(--faint)}
.cartao-corpo{padding:18px}

.faixa{
  display:grid;background:var(--white);border:1px solid var(--linha);
  border-radius:var(--rad);overflow:hidden;margin-bottom:20px;
}
.faixa.c5{grid-template-columns:repeat(5,1fr)}
.faixa.c4{grid-template-columns:repeat(4,1fr)}
.faixa-cel{padding:14px 16px;border-left:1px solid var(--linha2);min-width:0}
.faixa-cel:first-child{border-left:none}
.faixa-rot{
  font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);margin-bottom:5px;
}
.faixa-num{font-weight:800;font-size:26px;letter-spacing:-.035em;line-height:1.05}
.faixa-txt{font-weight:800;font-size:16px;letter-spacing:-.02em;line-height:1.22;padding-top:3px}
.faixa-pe{font-size:13px;color:var(--faint);margin-top:3px;line-height:1.35}

.vazio{
  padding:26px 20px;text-align:center;color:var(--faint);font-size:14.5px;
  line-height:1.6;background:var(--creme);border-radius:var(--rad-s);
  border:1px dashed var(--linha);
}
.vazio b{color:var(--soft)}

/* ============================== TABELAS ================================== */
.rolar{overflow-x:auto}
.rolar table{min-width:720px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{
  text-align:left;font-weight:700;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);
  padding:9px 12px;border-bottom:1px solid var(--linha);white-space:nowrap;
  background:var(--white);
}
th.ord{cursor:pointer;user-select:none}
th.ord:hover{color:var(--laranja)}
th .seta{display:inline-block;margin-left:4px;font-size:10.5px;opacity:.22}
th.ord.ativa{color:var(--laranja)}
th.ord.ativa .seta{opacity:1}
td{padding:11px 13px;border-bottom:1px solid var(--linha2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.clicavel{cursor:pointer}
tbody tr.clicavel:hover{background:var(--creme)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.acoes{text-align:right;white-space:nowrap}
.forte{font-weight:700}
.apagado{color:var(--mudo)}
.corta{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:14px;color:var(--faint)}
tr.destaque td:first-child{box-shadow:inset 3px 0 0 var(--ocre)}

/* ============================== BOTOES =================================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-weight:700;font-size:14px;padding:8px 16px;border-radius:var(--rad-p);
  border:1px solid var(--linha);background:var(--white);color:var(--ink);
  cursor:pointer;transition:background .14s,border-color .14s,transform .14s;
  white-space:nowrap;
}
.btn:hover{background:var(--creme);border-color:var(--mudo)}
.btn svg{stroke:currentColor}
.btn-forte{background:var(--laranja);border-color:var(--laranja);color:var(--creme)}
.btn-forte:hover{background:#C56A31;border-color:#C56A31;transform:translateY(-1px)}
.btn-perigo{color:var(--vermelho);border-color:rgba(155,42,42,.3)}
.btn-perigo:hover{background:rgba(155,42,42,.08);border-color:var(--vermelho)}
.btn-p{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default;transform:none}

.icone{
  display:inline-flex;align-items:center;justify-content:center;
  width:29px;height:29px;border-radius:9px;border:1px solid transparent;
  background:none;cursor:pointer;color:var(--faint);transition:background .14s,color .14s;
}
.icone:hover{background:var(--creme2);color:var(--ink)}
.icone svg{stroke:currentColor}
.icone.on{color:var(--laranja)}
.icone.mal:hover{color:var(--vermelho);background:rgba(155,42,42,.08)}

/* ============================ FERRAMENTAS ================================ */
.ferramentas{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:14px 18px;border-bottom:1px solid var(--linha2);
}
.busca{position:relative;flex:1;min-width:172px;max-width:310px}
.busca svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  stroke:var(--faint);pointer-events:none}
.busca input{
  width:100%;padding:8px 12px 8px 33px;border:1px solid var(--linha);
  border-radius:var(--rad-p);background:var(--white);font-size:14.5px;
}
.busca input:focus{outline:none;border-color:var(--laranja);
  box-shadow:0 0 0 3px rgba(180,95,43,.12)}
select.sel{
  padding:8px 12px;border:1px solid var(--linha);border-radius:var(--rad-p);
  background:var(--white);font-size:14px;font-weight:600;cursor:pointer;
  max-width:200px;
}
select.sel:focus{outline:none;border-color:var(--laranja)}
.espaco{flex:1}

.abas{display:flex;gap:5px;flex-wrap:wrap}
.aba{
  padding:7px 14px;border-radius:var(--rad-p);border:1px solid var(--linha);
  background:var(--white);font-size:14px;font-weight:700;cursor:pointer;
  color:var(--soft);transition:background .14s,color .14s,border-color .14s;
}
.aba:hover{background:var(--creme)}
.aba.on{background:rgba(180,95,43,.13);border-color:rgba(180,95,43,.34);color:var(--laranja)}

/* ============================== PILULAS ================================== */
.pil{
  display:inline-block;padding:3px 10px;border-radius:var(--rad-p);
  font-size:12.5px;font-weight:700;white-space:nowrap;line-height:1.5;
}
.pils{display:flex;gap:4px;flex-wrap:wrap}

/* status da pauta, na ordem do funil de producao */
.pil-p0{background:rgba(163,186,203,.34);color:#33485A}   /* Pesquisa */
.pil-p1{background:rgba(74,32,40,.09);color:var(--soft)}   /* Ideia */
.pil-p2{background:rgba(201,162,39,.2);color:#75590F}      /* Desenvolvendo */
.pil-p3{background:rgba(84,90,52,.18);color:#3F4527}       /* Pronto */
.pil-p4{background:var(--oliva);color:var(--creme)}        /* Publicado */

/* status do lead, na ordem do funil comercial */
.pil-l0{background:rgba(74,32,40,.09);color:var(--soft)}     /* Contato realizado */
.pil-l1{background:rgba(163,186,203,.34);color:#33485A}      /* Conversa */
.pil-l2{background:rgba(201,162,39,.2);color:#75590F}        /* Intencao */
.pil-l3{background:rgba(180,95,43,.17);color:#8C4520}        /* Oportunidade */
.pil-l4{background:rgba(180,95,43,.32);color:#6E3415}        /* Oferta */
.pil-l5{background:var(--oliva);color:var(--creme)}          /* Cliente */
.pil-l6{background:rgba(155,42,42,.11);color:var(--vermelho)}/* Nao agora */

/* ICP */
.pil-icp-sim{background:rgba(84,90,52,.18);color:#3F4527}
.pil-icp-conf{background:rgba(201,162,39,.18);color:#7A5F12}
.pil-icp-fora{background:rgba(74,32,40,.08);color:var(--mudo)}

/* formato da pauta e produto */
.pil-neutra{background:rgba(74,32,40,.08);color:var(--soft)}
.pil-obj{background:rgba(163,186,203,.28);color:#33485A}
.pil-macro{background:rgba(200,144,120,.24);color:#8A4E32}

/* nota fiscal e pagamento */
.pil-emitida{background:rgba(84,90,52,.16);color:#3F4527}
.pil-emitir{background:rgba(155,42,42,.12);color:var(--vermelho)}

/* avisos de data */
.pil-atrasado{background:rgba(155,42,42,.13);color:var(--vermelho)}
.pil-perto{background:rgba(201,162,39,.22);color:#7A5F12}
.pil-parado{background:rgba(74,32,40,.08);color:var(--faint)}

/* itens do calendario */
.pil-contato{background:rgba(200,144,120,.3);color:#7A4228}

/* ============================= CALENDARIO ================================ */
.cal-cab{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:5px}
.cal-dia-nome{
  text-align:center;font-weight:700;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);padding:4px 0;
}
.cal-grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-dia{
  min-width:0;overflow:hidden;position:relative;min-height:106px;background:var(--white);
  border:1px solid var(--linha);border-radius:10px;padding:6px 6px 5px;
  cursor:pointer;transition:border-color .14s,background .14s;
}
.cal-dia:hover{border-color:var(--terra);background:#FFFDFA}
.cal-dia.fora{background:var(--creme2);border-color:transparent;opacity:.5}
.cal-dia.hoje{border-color:var(--laranja);box-shadow:0 0 0 2px rgba(180,95,43,.16)}
.cal-n{font-weight:800;font-size:13.5px;color:var(--soft);margin-bottom:4px}
.cal-dia.hoje .cal-n{color:var(--laranja)}
.cal-dia.fora .cal-n{color:var(--mudo)}
.cal-mais-btn{
  position:absolute;top:4px;right:4px;width:19px;height:19px;border-radius:6px;
  border:none;background:var(--creme2);color:var(--soft);cursor:pointer;
  display:none;align-items:center;justify-content:center;font-weight:800;font-size:14.5px;
  line-height:1;padding:0;
}
.cal-dia:hover .cal-mais-btn{display:flex}
.cal-mais-btn:hover{background:var(--laranja);color:var(--creme)}
.cal-item{
  display:block;width:100%;text-align:left;border:none;cursor:pointer;
  font-size:12px;font-weight:600;line-height:1.3;
  padding:3px 5px;border-radius:5px;margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cal-item.feito{opacity:.55;text-decoration:line-through}
.cal-item.so-leitura{border-left:2px solid var(--ocre)}
.cal-n-mais{
  background:none;border:none;cursor:pointer;padding:2px 5px;
  font-size:11.5px;font-weight:700;color:var(--laranja);
}
.cal-n-mais:hover{text-decoration:underline}

/* --- jornada da cliente --------------------------------------------------- */
.jornada{
  font-size:12px;font-weight:600;color:var(--faint);margin-top:2px;
  display:inline-block;background:rgba(163,186,203,.26);color:#33485A;
  padding:1px 8px;border-radius:var(--rad-p);
}

/* --- campo travado, para nao mudar sem querer ----------------------------- */
.travado{display:flex;align-items:center;gap:8px}
.travado input{flex:1;min-width:0}
.campo input:disabled{
  background:var(--creme2);color:var(--soft);cursor:default;
  border-style:dashed;
}
.travado .btn{flex:none}

/* --- biblioteca de mensagens ---------------------------------------------- */
.msg{border:1px solid var(--linha);border-radius:var(--rad);background:var(--white);
  margin-bottom:14px;overflow:hidden}
.msg-cab{padding:15px 18px 0}
.msg-tit{font-weight:800;font-size:15.5px;letter-spacing:-.015em}
.msg-quando{font-size:13px;color:var(--faint);margin-top:3px;line-height:1.45}
.msg-princ{
  font-size:13.5px;color:var(--soft);background:var(--creme);border-left:3px solid var(--terra);
  border-radius:var(--rad-s);padding:11px 13px;margin:12px 18px 0;line-height:1.55;
}
.msg-corpo{padding:14px 18px 16px}
/* o texto sai igual ao que vai para o WhatsApp, com as quebras de linha */
.msg-txt{
  white-space:pre-wrap;font-size:14.5px;line-height:1.6;color:var(--ink);
  background:var(--creme);border:1px solid var(--linha);border-radius:var(--rad-s);
  padding:14px 16px;max-height:340px;overflow-y:auto;
}
.msg-txt mark{background:rgba(201,162,39,.35);color:var(--ink);padding:1px 3px;border-radius:3px;
  font-weight:700}
.msg-pe{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.msg-vars{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:200px}
.msg-var{display:flex;align-items:center;gap:6px}
.msg-var span{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--faint);
  text-transform:uppercase;white-space:nowrap}
.msg-var input{
  width:130px;padding:6px 10px;border:1px solid var(--linha);border-radius:var(--rad-p);
  background:var(--white);font-size:13px;
}
.msg-var input:focus{outline:none;border-color:var(--laranja);
  box-shadow:0 0 0 3px rgba(180,95,43,.12)}
.msg-nao{
  font-size:13px;line-height:1.55;color:#8C3030;background:rgba(155,42,42,.07);
  border-radius:var(--rad-s);padding:10px 13px;margin-top:12px;
}
.msg-nao b{display:block;font-size:10px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;opacity:.65;margin-bottom:6px}
.msg-nao div{padding-left:15px;position:relative;margin-top:6px}
.msg-nao div:first-of-type{margin-top:0}
.msg-nao div::before{content:'';position:absolute;left:2px;top:8px;width:5px;height:5px;
  border-radius:50%;background:currentColor;opacity:.55}
.msg-dica{
  font-size:13px;line-height:1.55;color:#75590F;background:rgba(201,162,39,.12);
  border-radius:var(--rad-s);padding:10px 13px;margin-top:10px;
}

/* --- importar lista de leads ---------------------------------------------- */
.previa{
  border:1px solid var(--linha);border-radius:var(--rad-s);overflow:hidden;
  margin-top:12px;max-height:280px;overflow-y:auto;
}
.previa table{font-size:13.5px}
.previa th{position:sticky;top:0;z-index:1}
.previa td{padding:8px 11px}
.previa tr.repetida td{opacity:.45}
.resumo{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;margin-top:11px}
.resumo b{font-size:17px;display:block;letter-spacing:-.02em}
.resumo .bom b{color:var(--oliva)}
.resumo .pulo b{color:var(--faint)}

/* --- prospeccao do dia ---------------------------------------------------- */
.meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.meta-esq{flex:1;min-width:210px}
.meta-num{font-weight:800;font-size:26px;letter-spacing:-.035em;line-height:1}
.meta-num b{color:var(--laranja)}
.meta-num.bateu b{color:var(--oliva)}
.meta-pe{font-size:13px;color:var(--faint);margin-top:4px;line-height:1.45}
.meta-tr{height:9px;background:var(--creme2);border-radius:5px;overflow:hidden;margin-top:10px}
.meta-in{height:100%;background:var(--laranja);border-radius:5px;transition:width .3s}
.meta-in.bateu{background:var(--oliva)}

/* os ultimos 7 dias, um bloquinho por dia */
.dias{display:flex;gap:6px;flex:none}
.dia{text-align:center;min-width:38px}
.dia-cx{
  height:40px;border-radius:8px;background:var(--creme2);display:flex;
  align-items:flex-end;justify-content:center;overflow:hidden;position:relative;
}
.dia-in{width:100%;background:var(--terra);border-radius:8px 8px 0 0}
.dia-in.bateu{background:var(--oliva)}
.dia-n{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--vinho)}
.dia-r{font-size:10.5px;font-weight:700;color:var(--faint);margin-top:4px;text-transform:uppercase}
.dia.hoje .dia-r{color:var(--laranja)}

/* --- os 4 portoes da Intencao --------------------------------------------- */
.portao{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--linha2)}
.portao:last-child{border-bottom:none}
.campo .portao input{width:18px;height:18px;flex:none;margin-top:2px;
  cursor:pointer;accent-color:var(--laranja);padding:0;border-radius:4px}
.portao > div:last-child{min-width:0;flex:1}
.portao-n{
  width:20px;height:20px;flex:none;border-radius:50%;background:var(--creme2);
  color:var(--faint);font-size:11px;font-weight:800;display:flex;
  align-items:center;justify-content:center;margin-top:1px;
}
.portao.ok .portao-n{background:var(--oliva);color:var(--creme)}
.campo .portao-t{display:block;font-weight:700;font-size:14.5px;line-height:1.35;
  cursor:pointer;text-transform:none;letter-spacing:0;color:var(--ink);margin-bottom:0}
.portao.ok .portao-t{color:var(--faint)}
.portao-d{font-size:13px;color:var(--faint);margin-top:3px;line-height:1.5}

/* o medidor de portoes, na tabela e no cartao */
.medidor{display:inline-flex;gap:3px;vertical-align:middle}
.medidor i{width:7px;height:7px;border-radius:50%;background:var(--linha);display:block}
.medidor i.on{background:var(--oliva)}
.falta{display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--linha2);font-size:14px;flex-wrap:wrap}
.falta:last-child{border-bottom:none}
.falta-n{font-weight:700;min-width:130px}
.falta-q{flex:1;min-width:180px;font-size:13px;color:var(--faint)}

/* --- faturamento mes a mes ------------------------------------------------ */
.mes{display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--linha2);font-size:14.5px}
.mes:last-child{border-bottom:none}
.mes.atual{background:rgba(201,162,39,.07);margin:0 -8px;padding-left:8px;padding-right:8px;
  border-radius:8px}
.mes-nome{width:168px;flex:none;font-weight:700}
.mes-tr{flex:1;min-width:50px;height:10px;background:var(--creme2);border-radius:5px;overflow:hidden}
.mes-in{height:100%;background:var(--laranja);border-radius:5px;transition:width .3s}
.mes-val{width:118px;flex:none;text-align:right;font-weight:800;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.mes-qtd{width:92px;flex:none;text-align:right;font-size:13px;color:var(--faint);white-space:nowrap}
.mes-var{width:78px;flex:none;text-align:right;font-size:13px;font-weight:700;white-space:nowrap}
.mes-var.sobe{color:#3F4527}
.mes-var.desce{color:var(--vermelho)}
.mes-var.igual{color:var(--mudo)}

.atras{display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--linha2);font-size:14.5px;flex-wrap:wrap}
.atras:last-child{border-bottom:none}
.atras-tit{font-weight:700;flex:1;min-width:130px}

/* ================================ MODAL ================================== */
.modal-fundo{
  position:fixed;inset:0;z-index:200;background:rgba(51,19,25,.5);
  display:none;align-items:flex-start;justify-content:center;
  padding:28px 18px;overflow-y:auto;backdrop-filter:blur(2px);
}
.modal-fundo.on{display:flex}
.modal{
  background:var(--white);border-radius:var(--rad);width:100%;max-width:520px;
  box-shadow:0 26px 70px rgba(0,0,0,.34);margin:auto;
}
.modal.larga{max-width:680px}
.modal-cab{
  display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;
  border-bottom:1px solid var(--linha2);
}
.modal-tit{flex:1;font-weight:800;font-size:18px;letter-spacing:-.025em;line-height:1.2}
.modal-sub{font-size:14px;color:var(--faint);margin-top:2px;font-weight:400}
.modal-corpo{padding:18px 20px}
.modal-pe{
  display:flex;gap:8px;justify-content:flex-end;padding:14px 20px 18px;
  border-top:1px solid var(--linha2);flex-wrap:wrap;
}
.modal-pe .esq{margin-right:auto}

.campo{margin-bottom:14px}
.campo:last-child{margin-bottom:0}
.campo label{
  display:block;font-weight:700;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--soft);margin-bottom:6px;
}
.campo input,.campo select,.campo textarea{
  width:100%;padding:10px 12px;border:1px solid var(--linha);
  border-radius:var(--rad-s);background:var(--white);font-size:15px;
}
.campo textarea{min-height:74px;resize:vertical;line-height:1.5}
.campo textarea.alto{min-height:150px}
.campo input:focus,.campo select:focus,.campo textarea:focus{
  outline:none;border-color:var(--laranja);box-shadow:0 0 0 3px rgba(180,95,43,.12);
}
.campo .dica{font-size:13px;color:var(--faint);margin-top:4px;text-transform:none;
  letter-spacing:0;font-weight:400}
.liga{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;
  cursor:pointer;text-transform:none;letter-spacing:0}
.liga input{width:17px;height:17px;flex:none;accent-color:var(--laranja);cursor:pointer}

/* grupo de caixinhas, para os campos que aceitam mais de um valor */
.multi{display:flex;flex-wrap:wrap;gap:7px}
.multi label{
  display:flex;align-items:center;gap:7px;margin:0;cursor:pointer;
  border:1px solid var(--linha);border-radius:var(--rad-p);padding:6px 12px;
  font-size:14px;font-weight:600;color:var(--soft);
  text-transform:none;letter-spacing:0;transition:background .14s,border-color .14s;
}
.multi label:hover{background:var(--creme)}
.multi input{width:15px;height:15px;accent-color:var(--laranja);cursor:pointer;margin:0}
.multi input:checked + span{color:var(--laranja)}

/* divisor de secao dentro do formulario */
.sec-form{
  font-weight:800;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--laranja);margin-bottom:14px;margin-top:8px;
  border-top:2px solid var(--linha);padding-top:20px;
}
.sec-form .sub{
  display:block;font-weight:400;font-size:13px;letter-spacing:0;
  text-transform:none;color:var(--mudo);margin-top:3px;
}

.erro-campo{
  background:rgba(155,42,42,.09);border:1px solid rgba(155,42,42,.24);
  color:var(--vermelho);border-radius:var(--rad-s);padding:9px 12px;
  font-size:14px;font-weight:600;margin-bottom:13px;display:none;
}
.erro-campo.on{display:block}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);
  background:var(--vinho);color:var(--creme);padding:11px 20px;
  border-radius:var(--rad-p);font-size:14.5px;font-weight:600;z-index:300;
  box-shadow:0 12px 30px rgba(0,0,0,.28);opacity:0;
  transition:transform .26s,opacity .26s;pointer-events:none;max-width:88vw;
  text-align:center;
}
.toast.on{transform:translate(-50%,0);opacity:1}

/* ============================== CELULAR ================================== */
@media (max-width:900px){
  .faixa.c5,.faixa.c4{grid-template-columns:1fr 1fr}
  .faixa-cel:nth-child(odd){border-left:none}

}
@media (max-width:760px){

  .conteudo{margin-left:0}
  .btn-menu{
    display:inline-flex;align-items:center;justify-content:center;

  }
  .btn-menu svg{stroke:currentColor}
  .topo{padding:13px 16px}
  .topo h1{font-size:19px}
  .bloco{padding:16px 16px 0}
  .avisos{margin:0 16px 14px}
  .cal-dia{min-height:82px}
  /* no celular a linha do mes empilha, senao nao cabe */
  .mes{flex-wrap:wrap;gap:6px 10px}
  .mes-nome{width:100%}
  .mes-tr{order:3;flex-basis:100%;min-width:0}
  .mes-val{width:auto;text-align:left}
  .mes-qtd{width:auto}
  .mes-var{width:auto}
  .cal-item{font-size:11px}
  .cal-dia-nome{font-size:10px;letter-spacing:.06em}
}
@media (max-width:420px){
  .faixa.c5,.faixa.c4{grid-template-columns:1fr}
  .faixa-cel{border-left:none;border-top:1px solid var(--linha2)}
  .faixa-cel:first-child{border-top:none}
}

<script>
(function(){
'use strict';

/* ==========================================================================
   1. A PRIMEIRA COISA DO SCRIPT: CONFERIR A SESSAO
   Sem sessao, vai para o login. A pagina so aparece depois desta conferencia.
   ========================================================================== */

var Estado = {
  aba:'pautas', email:'',
  pautas:[], leads:[], clientes:[],
  avisos:[],

  /* pautas */
  ptBusca:'', ptStatus:'todos', ptMacro:'todos', ptCol:'data', ptDir:1,
  /* calendario */
  calRef:new Date(), calTipo:'todos',
  /* pipeline */

};

(async function porta(){
  if (!window.sb) {
    document.getElementById('checando').textContent =
      'Não foi possível ligar no banco de dados. Recarregue a página.';
    return;
  }
  var sessao = null;
  try {
    var r = await window.sb.auth.getSession();
    sessao = r && r.data ? r.data.session : null;
  } catch (e) { sessao = null; }

  if (!sessao) { location.replace('../login/'); return; }

  Estado.email = (sessao.user && sessao.user.email) || '';
  document.getElementById('meuEmail').textContent = Estado.email;
  document.body.classList.add('liberado');

  iniciar();
})();


/* ==========================================================================
   2. AJUDANTES
   ========================================================================== */

function $(id){ return document.getElementById(id); }

function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function real(v){
  var n = Number(v);
  if (!isFinite(n)) n = 0;
  try { return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
  catch (e) { return 'R$ ' + n.toFixed(2); }
}
function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }
/* divisao segura: se o de baixo for zero, devolve zero em vez de NaN */
function div(a,b){ a = num(a); b = num(b); return b === 0 ? 0 : a / b; }

function pad(n){ return (n < 10 ? '0' : '') + n; }
function sData(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function hojeS(){ return sData(new Date()); }

function dData(s){
  if (!s) return null;
  var p = String(s).slice(0,10).split('-');
  if (p.length < 3) return null;
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return isNaN(d.getTime()) ? null : d;
}
function brData(s, comAno){
  var d = dData(s);
  if (!d) return '';
  return pad(d.getDate()) + '/' + pad(d.getMonth()+1) + (comAno ? '/' + d.getFullYear() : '');
}
function difDias(a, b){
  var x = dData(a), y = dData(b);
  if (!x || !y) return 0;
  return Math.round((y - x) / 86400000);
}
function plural(n, um, muitos){ return n + ' ' + (Math.abs(n) === 1 ? um : muitos); }
function capital(s){ s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }

var MESES = ['janeiro','fevereiro','março','abril','maio','junho',
             'julho','agosto','setembro','outubro','novembro','dezembro'];
var DIAS_CURTOS = ['seg','ter','qua','qui','sex','sáb','dom'];

/* garante que um campo que veio do banco como lista seja mesmo uma lista */
function lista(v){
  if (Array.isArray(v)) return v;
  if (v == null || v === '') return [];
  return [String(v)];
}

var toastT = null;
function toast(txt){
  var t = $('toast');
  t.textContent = txt;
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}

/* icones de traco, nunca emoji */

  pipeline:'<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',

  olho:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  olhoNao:'<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>',
  lixo:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"/>',

  busca:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',

  colar:'<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/>',
  mensagens:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
};
function svg(nome, tam){
  return '<svg width="' + (tam || 15) + '" height="' + (tam || 15) + '" viewBox="0 0 24 24" ' +
    'fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    (ICO[nome] || '') + '</svg>';
}


/* ==========================================================================
   3. O VOCABULARIO DO SEU NEGOCIO
   Sao exatamente as opcoes que voce ja usava no Notion.
   Os emoji foram retirados, o resto esta igual.
   ========================================================================== */

var PAUTA_STATUS    = ['Pesquisa','Ideia','Desenvolvendo','Pronto','Publicado'];
var PAUTA_FORMATO   = ['Reel análise','Reel falado','Reel cena','Carrossel','Estático',
                       'POV','Stories','Grupo Whatsapp','A definir'];

var LEAD_STATUS = ['Contato realizado','Conversa','Intenção','Oportunidade',

var PORTOES = [
  { nome:'Microdiagnóstico',
    dica:'Devolva uma leitura curta e específica: nega o problema óbvio, nomeia a distância real, devolve para ela. Nomeia O QUE falta, nunca COMO resolver.' },
  { nome:'Prova específica',

];
var NOMES_PORTOES = PORTOES.map(function(p){ return p.nome; });

/* a sua meta de prospeccao. Conta lead tocada no dia, pelo ultimo contato. */
var META_DIA = 7;

var CRM_STATUS = ['Lead','Desqualificado','Forms preenchido','Call 1 agendada',
                  'Enviar material etapa 1','Call 2 agendada','Enviar material etapa 2',
                  'Em negociação','Aguardando pagamento','Pago','Concluído'];
var OBJETIVO_CONTATO = ['Depoimento','Negociação','Entrega de material',
                        'Agendamento','Sessão agendada','Oferta Upgrade'];
var PRODUTO   = ['Leitura de Marca','Mentoria','Palestra','Workshop','Outro'];
var FORMA_PAG = ['PIX','Cartão Parcelado','Cartão à vista','Boleto'];
var STATUS_NF = ['A emitir','Emitida'];

/* posicao no funil, para ordenar pelo caminho e nunca pelo alfabeto */
function posPauta(s){ var i = PAUTA_STATUS.indexOf(String(s || '').trim()); return i < 0 ? 99 : i; }
function posLead(s){  var i = LEAD_STATUS.indexOf(String(s || '').trim());  return i < 0 ? 99 : i; }
function classePauta(s){ var i = posPauta(s); return 'pil pil-p' + (i > 4 ? 1 : i); }
function classeLead(s){  var i = posLead(s);  return 'pil pil-l' + (i > 6 ? 0 : i); }
function classeIcp(v){
  v = String(v || '');
  return 'pil ' + (v === 'Sim' ? 'pil-icp-sim' : v === 'Fora do ICP' ? 'pil-icp-fora' : 'pil-icp-conf');
}


/* ==========================================================================
   4. CARREGAR OS DADOS SEM NUNCA ABRIR EM BRANCO
   Se faltar uma tabela ou um campo, a gente anota o aviso e segue em frente.
   ========================================================================== */

function anotarAviso(txt){
  if (Estado.avisos.indexOf(txt) < 0) Estado.avisos.push(txt);
}

function explicarErro(tabela, erro){
  var cod = (erro && erro.code) || '';
  var msg = ((erro && erro.message) || '').toLowerCase();

  if (cod === '42P01' || msg.indexOf('does not exist') > -1 ||
      msg.indexOf('schema cache') > -1 || msg.indexOf('not find the table') > -1) {
    return 'A tabela <b>' + esc(tabela) + '</b> não foi encontrada no banco. ' +
           'Rode o arquivo banco.sql no Supabase para criar ela. ' +
           'O resto do painel continua funcionando normalmente.';
  }
  if (cod === '42703' || msg.indexOf('column') > -1) {
    return 'Falta um campo na tabela <b>' + esc(tabela) + '</b>. ' +
           'Rode o arquivo banco.sql de novo no Supabase, ele acrescenta o que estiver faltando. ' +
           'O resto do painel continua funcionando.';
  }
  if (cod === '42501' || msg.indexOf('row-level security') > -1 || msg.indexOf('permission') > -1) {
    return 'O banco não deixou ler a tabela <b>' + esc(tabela) + '</b>. ' +
           'Confira se você rodou o bloco das permissões do banco.sql.';
  }
  if (msg.indexOf('failed to fetch') > -1 || msg.indexOf('network') > -1) {
    return 'Sem conexão com o banco ao buscar <b>' + esc(tabela) + '</b>. Confira a sua internet.';
  }
  return 'Não foi possível carregar a tabela <b>' + esc(tabela) + '</b> agora. ' +
         'O resto do painel continua funcionando.';
}

async function ler(tabela, arrumar){
  try {
    var q = window.sb.from(tabela).select('*');
    if (arrumar) q = arrumar(q);
    var r = await q;
    if (r.error) { anotarAviso(explicarErro(tabela, r.error)); return []; }
    return r.data || [];
  } catch (e) {
    anotarAviso(explicarErro(tabela, e));
    return [];
  }
}

async function gravar(tabela, acao){
  try {
    var r = await acao(window.sb.from(tabela));
    if (r.error) {
      toast('Não foi possível salvar em ' + tabela + ' agora.');
      anotarAviso(explicarErro(tabela, r.error));
      desenharAvisos();
      return false;
    }
    return true;
  } catch (e) {
    toast('Não foi possível salvar agora. Tente de novo.');
    return false;
  }
}

async function carregarTudo(){
  Estado.avisos = [];

  var r = await Promise.all([
    ler('pautas',   function(q){ return q.order('data',{ascending:true,nullsFirst:false}); }),
    ler('leads',    function(q){ return q.order('id',{ascending:true}); }),
    ler('clientes', function(q){ return q.order('id',{ascending:true}); })
  ]);

  Estado.pautas   = r[0];
  Estado.leads    = r[1];
  Estado.clientes = r[2];

  desenharAvisos();
}

function desenharAvisos(){
  var cx = $('avisos');
  if (!Estado.avisos.length) { cx.className = 'avisos'; cx.innerHTML = ''; return; }
  cx.className = 'avisos tem';
  cx.innerHTML = Estado.avisos.map(function(a){ return '<div class="aviso">' + a + '</div>'; }).join('');
}

/* monta um formulario a partir de uma lista de campos */
function htmlCampos(campos, valores){
  valores = valores || {};
  return campos.filter(Boolean).map(function(c){

    /* divisor de secao, para separar por exemplo os dados fiscais */
    if (c.tipo === 'secao') {
      return '<div class="sec-form">' + esc(c.rot) +
        (c.dica ? '<span class="sub">' + esc(c.dica) + '</span>' : '') + '</div>';
    }

    var v = valores[c.k];
    if (v == null) v = (c.padrao != null ? c.padrao : '');

    if (c.tipo === 'liga') {
      return '<div class="campo"><label class="liga"><input type="checkbox" data-k="' + c.k + '"' +
        (v ? ' checked' : '') + '> <span>' + esc(c.rot) + '</span></label>' +
        (c.dica ? '<div class="dica">' + esc(c.dica) + '</div>' : '') + '</div>';
    }

    /* data que ja tem valor entra travada, para nao ser mudada sem querer */
    if (c.tipo === 'dataTravada') {
      var jaTem = !!v;
      return '<div class="campo"><label>' + esc(c.rot) + '</label>' +
        '<div class="travado">' +
          '<input type="date" data-k="' + c.k + '" value="' + esc(v) + '"' +
            (jaTem ? ' disabled' : '') + '>' +
          (jaTem ? '<button class="btn btn-p" type="button" data-destrava="' + c.k + '">Alterar</button>' : '') +
        '</div>' +
        (c.dica ? '<div class="dica">' + esc(c.dica) + '</div>' : '') + '</div>';
    }

    /* os 4 portoes, com o titulo e a explicacao de cada um */
    if (c.tipo === 'portoes') {
      var feitos = lista(valores[c.k]);
      return '<div class="campo"><label>' + esc(c.rot) + '</label>' +
        PORTOES.map(function(pt, i){
          var ok = feitos.indexOf(pt.nome) > -1;
          var idp = 'pt-' + i;
          return '<div class="portao' + (ok ? ' ok' : '') + '">' +
            '<input type="checkbox" id="' + idp + '" data-multi="' + c.k + '" value="' + esc(pt.nome) + '"' +
              (ok ? ' checked' : '') + '>' +
            '<div class="portao-n">' + (i+1) + '</div>' +
            '<div><label class="portao-t" for="' + idp + '">' + esc(pt.nome) + '</label>' +
            '<div class="portao-d">' + esc(pt.dica) + '</div></div></div>';
        }).join('') +
        (c.dica ? '<div class="dica">' + esc(c.dica) + '</div>' : '') + '</div>';
    }

    /* campo que aceita mais de um valor, virando caixinhas */
    if (c.tipo === 'multi') {
      var marcados = lista(valores[c.k]);
      return '<div class="campo"><label>' + esc(c.rot) + '</label><div class="multi">' +
        c.opcoes.map(function(o){
          return '<label><input type="checkbox" data-multi="' + c.k + '" value="' + esc(o) + '"' +
            (marcados.indexOf(o) > -1 ? ' checked' : '') + '><span>' + esc(o) + '</span></label>';
        }).join('') + '</div>' +
        (c.dica ? '<div class="dica">' + esc(c.dica) + '</div>' : '') + '</div>';
    }

    var dentro;
    if (c.tipo === 'select') {
      dentro = '<select data-k="' + c.k + '"' + (c.numero ? ' data-num="1"' : '') + '>' +
        (c.vazio ? '<option value=""' + (!v ? ' selected' : '') + '>' + esc(c.vazio) + '</option>' : '') +
        c.opcoes.map(function(o){
          /* opcao pode ser texto simples ou {v: valor, r: rotulo} */
          var val = (o && typeof o === 'object') ? o.v : o;
          var rot = (o && typeof o === 'object') ? o.r : o;
          return '<option value="' + esc(val) + '"' +
            (String(val) === String(v) ? ' selected' : '') + '>' + esc(rot) + '</option>';
        }).join('') + '</select>';
    } else if (c.tipo === 'area') {
      dentro = '<textarea data-k="' + c.k + '"' + (c.alto ? ' class="alto"' : '') +
        ' placeholder="' + esc(c.ph || '') + '">' + esc(v) + '</textarea>';
    } else {
      dentro = '<input type="' + (c.tipo || 'text') + '" data-k="' + c.k + '" value="' + esc(v) + '"' +
        (c.tipo === 'number' ? ' step="' + (c.passo || '1') + '" min="0"' : '') +
        ' placeholder="' + esc(c.ph || '') + '">';
    }

    return '<div class="campo"><label>' + esc(c.rot) + '</label>' + dentro +
      (c.dica ? '<div class="dica">' + esc(c.dica) + '</div>' : '') + '</div>';
  }).join('');
}

function lerCampos(m){
  var out = {};
  m.querySelectorAll('[data-k]').forEach(function(el){
    var k = el.getAttribute('data-k');
    if (el.type === 'checkbox') out[k] = el.checked;
    else if (el.type === 'number') out[k] = el.value === '' ? 0 : num(el.value);
    /* campo de data vazio precisa ir como vazio de verdade, senao o banco reclama */
    else if (el.type === 'date') out[k] = el.value === '' ? null : el.value;
    /* campo que guarda numero, tipo a ligacao com a lead */
    else if (el.getAttribute('data-num')) out[k] = el.value === '' ? null : num(el.value);
    else out[k] = el.value;
  });
  /* junta as caixinhas dos campos que aceitam mais de um valor */
  m.querySelectorAll('[data-multi]').forEach(function(el){
    var k = el.getAttribute('data-multi');
    if (!out[k]) out[k] = [];
    if (el.checked) out[k].push(el.value);
  });
  return out;
}

function mostrarErroForm(m, txt){
  var e = m.querySelector('.erro-campo');
  if (!e) return;
  e.textContent = txt;
  e.classList.add('on');
}

function formPadrao(cfg){
  abrirModal({
    titulo: cfg.titulo,
    sub: cfg.sub,
    larga: cfg.larga,
    corpo: '<div class="erro-campo"></div>' + htmlCampos(cfg.campos, cfg.valores),
    pe:
      (cfg.id ? '<button class="btn btn-perigo esq" type="button" data-apagar="1">' +
                svg('lixo',13) + ' Apagar</button>' : '') +
      (cfg.botaoExtra || '') +
      '<button class="btn" type="button" data-fechar="1">Cancelar</button>' +
      '<button class="btn btn-forte" type="button" data-salvar="1">Salvar</button>',
    depois: function(m){
      var primeiro = m.querySelector('input,select,textarea');
      if (primeiro) primeiro.focus();

      if (cfg.depoisDeMontar) cfg.depoisDeMontar(m);

      /* destrava um campo de data que veio travado */
      m.querySelectorAll('[data-destrava]').forEach(function(b){
        b.addEventListener('click', function(){
          var alvo = m.querySelector('[data-k="' + b.getAttribute('data-destrava') + '"]');
          if (alvo) { alvo.disabled = false; alvo.focus(); }
          b.remove();
        });
      });

      m.querySelector('[data-salvar]').addEventListener('click', async function(){
        var b = this;
        var dados = lerCampos(m);
        var erro = cfg.validar ? cfg.validar(dados) : '';
        if (erro) { mostrarErroForm(m, erro); return; }

        /* campos que nao aparecem no formulario mas vao junto */
        if (cfg.extras) { for (var ch in cfg.extras) dados[ch] = cfg.extras[ch]; }

        b.disabled = true; b.textContent = 'Salvando...';
        var ok = cfg.id
          ? await gravar(cfg.tabela, function(t){ return t.update(dados).eq('id', cfg.id); })
          : await gravar(cfg.tabela, function(t){ return t.insert(dados); });
        if (!ok) { b.disabled = false; b.textContent = 'Salvar'; return; }

        /* o que precisa acontecer depois de salvar, tipo graduar a lead */
        if (cfg.aposSalvar) { try { await cfg.aposSalvar(dados); } catch (e) {} }

        fecharModal();
        toast(cfg.id ? 'Alterado.' : 'Adicionado.');
        await carregarTudo();
        desenhar();
      });

      var ap = m.querySelector('[data-apagar]');
      if (ap) ap.addEventListener('click', function(){
        confirmar({
          titulo:'Apagar para sempre?',
          texto: cfg.textoApagar || 'Esta linha vai sair da sua base e não tem como voltar atrás.',
          aoSim: async function(){
            var ok = await gravar(cfg.tabela, function(t){ return t.delete().eq('id', cfg.id); });
            fecharModal();
            if (ok) toast('Apagado.');
            await carregarTudo();
            desenhar();
          }
        });
      });
    }
  });
}

function confirmar(cfg){
  abrirModal({
    titulo: cfg.titulo,
    corpo: '<div style="font-size:15px;line-height:1.6;color:var(--soft)">' + esc(cfg.texto) + '</div>',
    pe: '<button class="btn" type="button" data-fechar="1">Não, deixa</button>' +
        '<button class="btn btn-perigo" type="button" data-sim="1">Sim, apagar</button>',
    depois: function(m){
      m.querySelector('[data-sim]').addEventListener('click', function(){
        this.disabled = true;
        cfg.aoSim();
      });
    }
  });
}


/* ==========================================================================
   7. BAIXAR EM CSV, ABRINDO CERTINHO NO EXCEL COM ACENTO
   Duas coisas fazem o Excel brasileiro entender: o BOM no comeco do arquivo
   e o ponto e virgula separando as colunas.
   ========================================================================== */

function celulaCSV(v){
  if (Array.isArray(v)) v = v.join(', ');
  var s = (v == null ? '' : String(v));
  if (/["\n\r;]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function baixarCSV(nomeArquivo, colunas, linhas){
  var sep = ';';
  var txt = colunas.map(function(c){ return celulaCSV(c.rot); }).join(sep) + '\r\n';
  linhas.forEach(function(l){
    txt += colunas.map(function(c){
      return celulaCSV(c.val ? c.val(l) : l[c.k]);
    }).join(sep) + '\r\n';
  });

  try {
    var blob = new Blob(['﻿' + txt], { type:'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nomeArquivo + '-' + hojeS() + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
    toast('Arquivo baixado.');
  } catch (e) {
    toast('Não foi possível baixar agora.');
  }
}

function celDinheiro(rot, v, pe){

function acharPorId(lista, id){
  for (var i = 0; i < lista.length; i++) {
    if (String(lista[i].id) === String(id)) return lista[i];
  }
  return null;
}
function maisComum(lista){
  var c = {}, melhor = null, maior = 0;
  lista.forEach(function(v){
    var k = String(v == null ? '' : v).trim();
    if (!k) return;
    c[k] = (c[k] || 0) + 1;
    if (c[k] > maior) { maior = c[k]; melhor = k; }
  });
  return { nome: melhor, n: maior };
}
/* cabecalho de tabela que ordena ao clicar, e inverte no segundo clique */
function ths(colunas, colAtual, dir){
  return colunas.map(function(c){
    var ativa = colAtual === c.k;
    var seta = ativa ? (dir === 1 ? '▲' : '▼') : '◆';
    return '<th class="ord' + (ativa ? ' ativa' : '') + '" data-col="' + c.k + '"' +
      (c.larg ? ' style="width:' + c.larg + '"' : '') + ' title="Clique para ordenar">' +
      esc(c.rot) + '<span class="seta">' + seta + '</span></th>';
  }).join('');
}
function ligarOrdenacao(guardaCol, guardaDir, redesenhar){
  $('painel').querySelectorAll('[data-col]').forEach(function(th){
    th.addEventListener('click', function(){
      var col = th.getAttribute('data-col');
      if (Estado[guardaCol] === col) Estado[guardaDir] = -Estado[guardaDir];
      else { Estado[guardaCol] = col; Estado[guardaDir] = 1; }
      redesenhar();
    });
  });
}
/* busca que nao perde o cursor ao redesenhar */
function ligarBusca(idCampo, guarda, redesenhar){
  var cb = $(idCampo);
  if (!cb) return;
  cb.addEventListener('input', function(){
    Estado[guarda] = cb.value;
    var p = cb.selectionStart;
    redesenhar();
    var novo = $(idCampo);
    if (novo) { novo.focus(); try { novo.setSelectionRange(p,p); } catch(e){} }
  });
}
function ordenar(a, b, dir){
  if (a < b) return -1 * dir;
  if (a > b) return  1 * dir;
  return 0;
}
function linkInsta(arroba){
  var u = String(arroba || '').trim();
  var m = u.match(/@([A-Za-z0-9._]+)/);
  if (!m) return '';
  return 'https://instagram.com/' + m[1];

function soNumeros(t){ return String(t || '').replace(/\D/g,''); }
function linkZap(tel){

/* ==========================================================================
   9. ABA PAUTAS  ·  o seu banco de pautas
   ========================================================================== */

function telaPautas(){
  var busca = Estado.ptBusca.trim().toLowerCase();
  var hoje = hojeS();

  var listaP = Estado.pautas.filter(function(p){
    if (Estado.ptStatus !== 'todos' && String(p.status || '') !== Estado.ptStatus) return false;
    if (Estado.ptMacro !== 'todos' && String(p.macrotema || '') !== Estado.ptMacro) return false;
    if (!busca) return true;
    return [p.pauta, p.formato, p.macrotema, p.formato_editorial, p.notas].some(function(c){
      return String(c || '').toLowerCase().indexOf(busca) > -1;
    });
  });

  listaP.sort(function(a,b){
    var col = Estado.ptCol, d = Estado.ptDir, x, y;
    if (col === 'status')     { x = posPauta(a.status); y = posPauta(b.status); }
    else if (col === 'data')  { x = a.data || '9999-12-31'; y = b.data || '9999-12-31'; }
    else if (col === 'publicado') { x = a.publicado ? 0 : 1; y = b.publicado ? 0 : 1; }
    else { x = String(a[col] || '').toLowerCase(); y = String(b[col] || '').toLowerCase(); }
    return ordenar(x, y, d) || num(a.id) - num(b.id);
  });

  /* --- a faixa de numeros ------------------------------------------------ */
  var todas     = Estado.pautas;
  var publicadas = todas.filter(function(p){ return p.publicado; });
  var prontas   = todas.filter(function(p){ return String(p.status) === 'Pronto' && !p.publicado; });
  var semData   = todas.filter(function(p){ return !p.data; });
  var macro     = maisComum(todas.map(function(p){ return p.macrotema; }));

  var h = '<div class="faixa c5">' +
    cel('Pautas', todas.length, todas.length === 0 ? 'nenhuma ainda' : 'no banco') +

/* ==========================================================================
   10. ABA CALENDARIO  ·  as pautas e os contatos do mes
   Os contatos vem da Base de Clientes, para voce nao digitar duas vezes.
   ========================================================================== */

function itensDoCalendario(){
  var itens = [];

  if (Estado.calTipo === 'todos' || Estado.calTipo === 'pautas') {
    Estado.pautas.forEach(function(p){
      if (!p || !p.data) return;
      itens.push({
        chave:'pauta-' + p.id, dia:String(p.data).slice(0,10),
        titulo:p.pauta || 'Sem título',
        detalhe:[p.formato, p.macrotema].filter(Boolean).join(' · '),
        classe:'pil-p' + (posPauta(p.status) > 4 ? 1 : posPauta(p.status)),
        feito:!!p.publicado, deCliente:false, bruto:p
      });
    });
  }

  if (Estado.calTipo === 'todos' || Estado.calTipo === 'contatos') {
    Estado.clientes.forEach(function(c){
      if (!c || !c.proximo_contato) return;
      itens.push({
        chave:'cli-' + c.id, dia:String(c.proximo_contato).slice(0,10),
        titulo:'Contato: ' + (c.cliente || 'cliente'),
        detalhe:c.objetivo_contato || '',
        classe:'pil-contato', feito:false, deCliente:true, bruto:c
      });
    });
  }
  return itens;
}

function telaCalendario(){
  var ref = Estado.calRef;
  var ano = ref.getFullYear(), mes = ref.getMonth();
  var hoje = hojeS();

  var itens = itensDoCalendario();
  var porDia = {};
  itens.forEach(function(it){
    if (!porDia[it.dia]) porDia[it.dia] = [];
    porDia[it.dia].push(it);
  });

  /* a grade comeca na segunda-feira */
  var primeiro = new Date(ano, mes, 1);
  var desloca = (primeiro.getDay() + 6) % 7;        /* domingo=0 vira 6 */
  var inicio = new Date(ano, mes, 1 - desloca);

  /* quantas pautas tem neste mes */
  var doMes = Estado.pautas.filter(function(p){
    if (!p.data) return false;
    var d = dData(p.data);
    return d && d.getFullYear() === ano && d.getMonth() === mes;
  });

  var h = '<div class="faixa c4">' +
    cel('Pautas no mês', doMes.length, capital(MESES[mes]) + ' de ' + ano) +
    cel('Já publicadas', doMes.filter(function(p){ return p.publicado; }).length,
        doMes.length ? 'de ' + doMes.length + ' no mês' : '') +
    cel('Contatos marcados', Estado.clientes.filter(function(c){
        if (!c.proximo_contato) return false;
        var d = dData(c.proximo_contato);
        return d && d.getFullYear() === ano && d.getMonth() === mes;
      }).length, 'vindos dos Clientes') +
    cel('Sem data no banco', Estado.pautas.filter(function(p){ return !p.data; }).length,
        'ideias esperando dia') +
  '</div>';

  h += '<div class="cartao"><div class="ferramentas">' +
    '<button class="icone" type="button" id="calAnt" title="Mês anterior">' + svg('esq',16) + '</button>' +
    '<div class="cartao-tit" style="min-width:150px;text-align:center">' +
      capital(MESES[mes]) + ' de ' + ano + '</div>' +
    '<button class="icone" type="button" id="calProx" title="Próximo mês">' + svg('dir',16) + '</button>' +
    '<button class="btn btn-p" type="button" id="calHoje">Este mês</button>' +
    '<div class="espaco"></div>' +
    '<div class="abas">' +
      [['todos','Tudo'],['pautas','Só pautas'],['contatos','Só contatos']].map(function(t){
        return '<button class="aba' + (Estado.calTipo === t[0] ? ' on' : '') +
          '" type="button" data-tipo="' + t[0] + '">' + t[1] + '</button>';
      }).join('') +
    '</div>' +
    '<button class="btn btn-forte" type="button" id="calAdd">' + svg('mais',13) + ' Nova pauta</button>' +
  '</div><div class="cartao-corpo">';

  h += '<div class="cal-cab">' + DIAS_CURTOS.map(function(d){
    return '<div class="cal-dia-nome">' + d + '</div>';
  }).join('') + '</div><div class="cal-grade">';

  /* 6 semanas cobrem qualquer mes */
  for (var i = 0; i < 42; i++) {
    var d = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + i);
    var s = sData(d);
    var fora = d.getMonth() !== mes;
    var doDia = porDia[s] || [];

    h += '<div class="cal-dia' + (fora ? ' fora' : '') + (s === hoje ? ' hoje' : '') + '" data-dia="' + s + '">' +
      '<button class="cal-mais-btn" type="button" data-novo="' + s + '" title="Nova pauta neste dia">+</button>' +
      '<div class="cal-n">' + d.getDate() + '</div>';

    doDia.slice(0, 3).forEach(function(it){
      h += '<button class="cal-item ' + it.classe + (it.feito ? ' feito' : '') +
        (it.deCliente ? ' so-leitura' : '') + '" type="button" data-item="' + esc(it.chave) + '" ' +
        'title="' + esc(it.titulo + (it.detalhe ? ' · ' + it.detalhe : '')) + '">' +
        esc(it.titulo) + '</button>';
    });
    if (doDia.length > 3) {
      h += '<button class="cal-n-mais" type="button" data-ver="' + s + '">+' + (doDia.length - 3) + ' mais</button>';
    }
    h += '</div>';
  }
  h += '</div></div></div>';

  /* --- ficou pra tras --------------------------------------------------- */
  var atrasadas = Estado.pautas.filter(function(p){
    return p && p.data && !p.publicado && String(p.data).slice(0,10) < hoje;
  }).sort(function(a,b){ return String(a.data) < String(b.data) ? -1 : 1; });

  var contatosVencidos = Estado.clientes.filter(function(c){
    return c && c.proximo_contato && String(c.proximo_contato).slice(0,10) < hoje;
  }).sort(function(a,b){ return String(a.proximo_contato) < String(b.proximo_contato) ? -1 : 1; });

  h += '<div class="cartao"><div class="cartao-topo">' +
    '<div><div class="cartao-tit">Ficou pra trás</div>' +
    '<div class="cartao-sub">Passou do dia e ainda não saiu</div></div></div><div class="cartao-corpo">';

  if (!atrasadas.length && !contatosVencidos.length) {
    h += '<div class="vazio">Nada atrasado. Aqui vai aparecer <b>a pauta que passou da data e não foi ' +
         'publicada</b>, e <b>o contato de cliente que venceu</b>, dizendo há quantos dias.</div>';
  } else {
    h += atrasadas.map(function(p){
      var dias = difDias(String(p.data).slice(0,10), hoje);
      return '<div class="atras">' +
        '<span class="' + classePauta(p.status) + '">' + esc(p.status || 'Ideia') + '</span>' +
        '<span class="atras-tit">' + esc(p.pauta || 'Sem título') + '</span>' +
        '<span class="pil pil-atrasado">há ' + plural(dias,'dia','dias') + '</span>' +
        '<button class="btn btn-p" type="button" data-nopar="' + esc(p.id) + '">Marcar publicada</button>' +
        '<button class="btn btn-p" type="button" data-edpauta="' + esc(p.id) + '">Abrir</button>' +
      '</div>';
    }).join('');
    h += contatosVencidos.map(function(c){
      var dias = difDias(String(c.proximo_contato).slice(0,10), hoje);
      return '<div class="atras">' +
        '<span class="pil pil-contato">Contato</span>' +
        '<span class="atras-tit">' + esc(c.cliente || 'Cliente') +
          (c.objetivo_contato ? ' <span style="font-weight:400;color:var(--faint)">· ' +
            esc(c.objetivo_contato) + '</span>' : '') + '</span>' +
        '<span class="pil pil-atrasado">há ' + plural(dias,'dia','dias') + '</span>' +
        '<button class="btn btn-p" type="button" data-edcli="' + esc(c.id) + '">Abrir</button>' +
      '</div>';
    }).join('');
  }
  h += '</div></div>';

  $('painel').innerHTML = h;

  $('calAnt').addEventListener('click', function(){
    Estado.calRef = new Date(ano, mes - 1, 1); telaCalendario();
  });
  $('calProx').addEventListener('click', function(){
    Estado.calRef = new Date(ano, mes + 1, 1); telaCalendario();
  });
  $('calHoje').addEventListener('click', function(){
    Estado.calRef = new Date(); telaCalendario();
  });
  $('painel').querySelectorAll('[data-tipo]').forEach(function(b){
    b.addEventListener('click', function(){
      Estado.calTipo = b.getAttribute('data-tipo'); telaCalendario();
    });
  });
  $('calAdd').addEventListener('click', function(){ formPauta(null, hoje); });

  /* clicar no dia ja abre a pauta nova com a data preenchida */
  $('painel').querySelectorAll('.cal-dia').forEach(function(cx){
    cx.addEventListener('click', function(ev){
      if (ev.target.closest('.cal-item,.cal-n-mais,.cal-mais-btn')) return;

    });
  });
  $('painel').querySelectorAll('[data-novo]').forEach(function(b){
    b.addEventListener('click', function(ev){
      ev.stopPropagation();
      formPauta(null, b.getAttribute('data-novo'));
    });

  $('painel').querySelectorAll('[data-item]').forEach(function(b){
    b.addEventListener('click', function(ev){

  $('painel').querySelectorAll('[data-ver]').forEach(function(b){

  $('painel').querySelectorAll('[data-nopar]').forEach(function(b){
    b.addEventListener('click', async function(){

      });

  $('painel').querySelectorAll('[data-edpauta]').forEach(function(b){

/* ==========================================================================
   11. ABA PIPELINE  ·  as suas leads
   ========================================================================== */

/* tira acento e caixa, para comparar nome sem tropecar em maiuscula ou til */
function semAcento(t){
  return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/\s+/g,' ').trim();
}
/* pega so o @ de um texto de contato, se houver */
function soArroba(t){
  var m = String(t || '').match(/@([A-Za-z0-9._]+)/);
  return m ? m[1].toLowerCase() : '';
}

/* --------------------------------------------------------------------------
   LE UMA LISTA COLADA E DEVOLVE AS LEADS QUE DA PARA IMPORTAR
   Aceita uma lead por linha. As colunas podem vir separadas por tabulacao
   (quando voce cola de planilha), por ponto e virgula ou por virgula:
     Nome ; @contato ; origem ; tempo de mercado ; notas
   Linha com uma coluna so vira o nome. Se comecar com @, vira o contato.
   -------------------------------------------------------------------------- */
function lerListaColada(txt){
  var jaTem = {};
  Estado.leads.forEach(function(l){
    var n = semAcento(l.lead); if (n) jaTem['n:' + n] = true;
    var a = soArroba(l.contato); if (a) jaTem['a:' + a] = true;
  });

  var novas = [], repetidas = [], nesteLote = {};

  String(txt || '').split(/\r?\n/).forEach(function(linha, i) {
    var t = linha.trim();
    if (!t) return;

    /* descarta o cabecalho da planilha, se vier junto */
    if (i === 0 && /(^|;|,|\t)\s*(nome|lead|marca|cliente)\s*($|;|,|\t)/i.test(t) && t.indexOf('@') < 0) return;

    var sep = t.indexOf('\t') > -1 ? '\t' : (t.indexOf(';') > -1 ? ';' : ',');
    var col = t.split(sep).map(function(x){ return x.trim(); });

    var nome = col[0] || '';
    var contato = col[1] || '';
    /* linha com uma coluna so: se comeca com @, e contato sem nome */
    if (col.length === 1 && nome.charAt(0) === '@') { contato = nome; nome = nome.replace('@',''); }
    if (!nome) return;

    var chaveN = 'n:' + semAcento(nome);
    var arroba = soArroba(contato);
    var chaveA = arroba ? 'a:' + arroba : null;

    var repetida = jaTem[chaveN] || (chaveA && jaTem[chaveA]) ||
                   nesteLote[chaveN] || (chaveA && nesteLote[chaveA]);

    var item = {
      lead: nome.slice(0,120),
      contato: contato.slice(0,160),
      origem: (col[2] || '').slice(0,60),
      tempo_mercado: (col[3] || '').slice(0,80),
      notas: (col[4] || '').slice(0,2000)
    };

    if (repetida) { repetidas.push(item); return; }
    nesteLote[chaveN] = true;
    if (chaveA) nesteLote[chaveA] = true;
    novas.push(item);
  });

  return { novas: novas, repetidas: repetidas };
}

/* --------------------------------------------------------------------------
   JORNADA: da primeira conversa ate o pagamento.
   So existe quando a cliente esta ligada a uma lead e as duas datas existem.
   -------------------------------------------------------------------------- */
function leadDoCliente(c){
  if (!c || !c.lead_id) return null;
  return acharPorId(Estado.leads, c.lead_id);
}
function jornadaDe(c){
  var l = leadDoCliente(c);
  if (!l || !l.primeiro_contato || !c.data_pagamento) return null;
  var ini = String(l.primeiro_contato).slice(0,10);
  var fim = String(c.data_pagamento).slice(0,10);
  var dias = difDias(ini, fim);
  if (dias < 0) return null;          /* data trocada, melhor nao inventar */
  return { inicio: ini, fim: fim, dias: dias, lead: l };
}

/* quem foi tocada num dia: lead cujo ultimo contato e aquele dia */
function tocadasEm(dia){
  return Estado.leads.filter(function(l){
    return l && l.ultimo_contato && String(l.ultimo_contato).slice(0,10) === dia;
  });
}
/* os ultimos 7 dias, do mais antigo para hoje */
function semanaDeToques(){
  var hoje = new Date(), fora = [];
  for (var i = 6; i >= 0; i--) {
    var d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() - i);
    var dia = sData(d);
    fora.push({ dia:dia, n:tocadasEm(dia).length, rotulo:DIAS_CURTOS[(d.getDay()+6)%7], hoje:i === 0 });
  }
  return fora;
}

/* quantos portoes ja foram cumpridos nesta lead */
function contaPortoes(l){
  var f = lista(l && l.portoes);
  return NOMES_PORTOES.filter(function(n){ return f.indexOf(n) > -1; }).length;
}
function faltamPortoes(l){
  var f = lista(l && l.portoes);
  return NOMES_PORTOES.filter(function(n){ return f.indexOf(n) < 0; });
}
/* quatro bolinhas, as cumpridas em verde */
function medidorPortoes(portoes){
  var f = lista(portoes);
  return '<span class="medidor" title="portões da Intenção: ' +
    f.length + ' de 4">' + NOMES_PORTOES.map(function(n){
      return '<i class="' + (f.indexOf(n) > -1 ? 'on' : '') + '"></i>';
    }).join('') + '</span>';
}

function telaPipeline(){
  var busca = Estado.lgBusca.trim().toLowerCase();
  var hoje = hojeS();

  var listaL = Estado.leads.filter(function(l){
    if (Estado.lgStatus !== 'todos' && String(l.status || '') !== Estado.lgStatus) return false;
    if (Estado.lgIcp !== 'todos' && String(l.icp || '') !== Estado.lgIcp) return false;
    if (!busca) return true;
    return [l.lead, l.contato, l.origem, l.frase_real, l.proximo_passo, l.notas].some(function(c){
      return String(c || '').toLowerCase().indexOf(busca) > -1;
    });
  });

  listaL.sort(function(a,b){
    var col = Estado.lgCol, d = Estado.lgDir, x, y;
    if (col === 'status')            { x = posLead(a.status); y = posLead(b.status); }
    else if (col === 'ultimo_contato'){ x = a.ultimo_contato || '0000-01-01'; y = b.ultimo_contato || '0000-01-01'; }
    else if (col === 'icp')          { x = ICP.indexOf(String(a.icp)); y = ICP.indexOf(String(b.icp)); }
    else { x = String(a[col] || '').toLowerCase(); y = String(b[col] || '').toLowerCase(); }
    return ordenar(x, y, d) || num(a.id) - num(b.id);
  });

  /* --- a faixa de numeros ------------------------------------------------ */
  var todas   = Estado.leads;
  var icpSim  = todas.filter(function(l){ return String(l.icp) === 'Sim'; });
  var quentes = todas.filter(function(l){
    var p = posLead(l.status);
    return p === 3 || p === 4;      /* Oportunidade e Oferta */
  });
  var paradas = todas.filter(function(l){
    if (!l.ultimo_contato) return false;
    if (posLead(l.status) >= 5) return false;      /* ja virou cliente ou saiu */
    return difDias(String(l.ultimo_contato).slice(0,10), hoje) > 14;
  });
  var origem = maisComum(todas.map(function(l){ return l.origem; }));

  /* --- prospeccao do dia, meta de 7 -------------------------------------- */
  var semana = semanaDeToques();
  var hojeN = semana[semana.length-1].n;
  var bateu = hojeN >= META_DIA;
  var pctMeta = Math.min(100, Math.round(div(hojeN, META_DIA) * 100));
  var maiorDia = Math.max.apply(null, semana.map(function(d){ return d.n; }).concat([META_DIA]));
  var nomesHoje = tocadasEm(hoje).map(function(l){ return l.lead; });

  var h = '<div class="cartao"><div class="cartao-corpo"><div class="meta">' +
    '<div class="meta-esq">' +
      '<div class="faixa-rot">Prospecção de hoje</div>' +
      '<div class="meta-num' + (bateu ? ' bateu' : '') + '"><b>' + hojeN + '</b> de ' + META_DIA + '</div>' +
      '<div class="meta-tr"><div class="meta-in' + (bateu ? ' bateu' : '') +
        '" style="width:' + pctMeta + '%"></div></div>' +
      '<div class="meta-pe">' + (bateu
          ? 'Meta batida. ' + esc(nomesHoje.slice(0,4).join(', ')) +
            (nomesHoje.length > 4 ? ' e mais ' + (nomesHoje.length-4) : '')
          : hojeN === 0
            ? 'Nenhum toque hoje ainda. A meta é tocar ' + META_DIA + ' leads por dia.'
            : 'Faltam ' + (META_DIA - hojeN) + '. Até agora: ' +
              esc(nomesHoje.slice(0,4).join(', ')) +
              (nomesHoje.length > 4 ? ' e mais ' + (nomesHoje.length-4) : '')) +
      '</div>' +
    '</div>' +
    '<div class="dias">' + semana.map(function(d){
      var alt = maiorDia > 0 ? Math.round(div(d.n, maiorDia) * 100) : 0;
      return '<div class="dia' + (d.hoje ? ' hoje' : '') + '" title="' + brData(d.dia, true) +
        ': ' + plural(d.n,'toque','toques') + '">' +
        '<div class="dia-cx"><div class="dia-in' + (d.n >= META_DIA ? ' bateu' : '') +
          '" style="height:' + alt + '%"></div>' +
          '<div class="dia-n">' + (d.n || '') + '</div></div>' +
        '<div class="dia-r">' + d.rotulo + '</div></div>';
    }).join('') + '</div>' +
  '</div></div></div>';

  h += '<div class="faixa c5">' +
    cel('Leads', todas.length, todas.length === 0 ? 'nenhuma ainda' : 'no pipeline') +
    cel('Dentro do ICP', icpSim.length,
        todas.length ? Math.round(div(icpSim.length, todas.length) * 100) + '% do total' : '') +
    cel('Quentes agora', quentes.length, 'em Oportunidade ou Oferta') +
    cel('Paradas há mais de 14 dias', paradas.length,
        paradas.length ? 'merecem um toque' : 'nenhuma esfriando') +
    celTexto('Origem mais forte', origem.nome || 'Sem dados ainda',
        origem.nome ? plural(origem.n,'lead','leads') : 'preencha a origem') +
  '</div>';

  /* --- os 4 portoes da Intencao ------------------------------------------ */
  var emIntencao = todas.filter(function(l){ return posLead(l.status) === 2; });
  /* quem ja subiu para Oportunidade ou Oferta sem ter fechado os quatro */
  var subiuCedo = todas.filter(function(l){
    var pz = posLead(l.status);
    return (pz === 3 || pz === 4) && contaPortoes(l) < 4;
  });
  var prontas = emIntencao.filter(function(l){ return contaPortoes(l) === 4; });

  if (emIntencao.length || subiuCedo.length) {
    h += '<div class="cartao"><div class="cartao-topo"><div>' +
      '<div class="cartao-tit">O que falta em cada conversa</div>' +
      '<div class="cartao-sub">Os 4 portões da Intenção, na ordem. ' +
      'Só depois dos quatro a lead sobe para Oportunidade.</div></div>' +
      (prontas.length ? '<div class="espaco"></div><span class="pil pil-l5">' +
        plural(prontas.length,'pronta para subir','prontas para subir') + '</span>' : '') +
      '</div><div class="cartao-corpo">';

    h += emIntencao.map(function(l){
      var falta = faltamPortoes(l);
      return '<div class="falta">' +
        medidorPortoes(l.portoes) +
        '<span class="falta-n">' + esc(l.lead || 'Sem nome') + '</span>' +
        '<span class="falta-q">' + (falta.length
            ? 'falta: <b style="color:var(--soft)">' + esc(falta[0]) + '</b>' +
              (falta.length > 1 ? ' <span class="apagado">e mais ' + (falta.length-1) + '</span>' : '')

        '<button class="btn btn-p" type="button" data-abrelead="' + esc(l.id) + '">Abrir</button>' +
      '</div>';
    }).join('');

    h += subiuCedo.map(function(l){
      return '<div class="falta">' +
        medidorPortoes(l.portoes) +
        '<span class="falta-n">' + esc(l.lead || 'Sem nome') + '</span>' +
        '<span class="falta-q"><span class="pil pil-perto">subiu sem fechar</span> ' +
          'está em ' + esc(l.status) + ' com ' + contaPortoes(l) + ' de 4</span>' +
        '<button class="btn btn-p" type="button" data-abrelead="' + esc(l.id) + '">Abrir</button>' +
      '</div>';
    }).join('');

    h += '</div></div>';
  }

  h += '<div class="cartao"><div class="ferramentas">' +
    '<div class="busca">' + svg('busca',14) +
      '<input id="lgBusca" type="search" placeholder="Buscar lead, @, frase ou nota" value="' +
      esc(Estado.lgBusca) + '"></div>' +
    '<select class="sel" id="lgStatus">' +
      '<option value="todos"' + (Estado.lgStatus === 'todos' ? ' selected' : '') + '>Todo o funil</option>' +
      LEAD_STATUS.map(function(s){
        return '<option value="' + esc(s) + '"' + (Estado.lgStatus === s ? ' selected' : '') + '>' + esc(s) + '</option>';
      }).join('') + '</select>' +
    '<select class="sel" id="lgIcp">' +
      '<option value="todos"' + (Estado.lgIcp === 'todos' ? ' selected' : '') + '>Todo ICP</option>' +
      ICP.map(function(s){
        return '<option value="' + esc(s) + '"' + (Estado.lgIcp === s ? ' selected' : '') + '>' + esc(s) + '</option>';
      }).join('') + '</select>' +
    '<div class="espaco"></div>' +
    '<button class="btn" type="button" id="lgBaixar">' + svg('baixar',13) + ' Baixar CSV</button>' +
    '<button class="btn" type="button" id="lgImportar">' + svg('colar',13) + ' Importar lista</button>' +
    '<button class="btn btn-forte" type="button" id="lgAdd">' + svg('mais',13) + ' Nova lead</button>' +
  '</div>';

  if (!todas.length) {
    h += '<div class="cartao-corpo"><div class="vazio">O seu pipeline está vazio. ' +
         'Clique em <b>Nova lead</b> para começar.</div></div>';
  } else if (!listaL.length) {
    h += '<div class="cartao-corpo"><div class="vazio">Nenhuma lead com esse filtro. ' +
         'Tente <b>Todo o funil</b> ou outra palavra na busca.</div></div>';
  } else {
    h += '<div class="rolar"><table><thead><tr>' +
      ths([
        { k:'lead', rot:'Lead' }, { k:'contato', rot:'Contato' },
        { k:'status', rot:'Status' }, { k:'icp', rot:'ICP' },
        { k:'origem', rot:'Origem' }, { k:'tempo_mercado', rot:'Tempo de mercado' },
        { k:'ultimo_contato', rot:'Último contato' }, { k:'proximo_passo', rot:'Próximo passo' }
      ], Estado.lgCol, Estado.lgDir) + '<th style="width:44px"></th></tr></thead><tbody>' +
      listaL.map(function(l){
        var insta = linkInsta(l.contato);
        var zap = linkZap(l.contato);
        var dias = l.ultimo_contato ? difDias(String(l.ultimo_contato).slice(0,10), hoje) : null;
        var fechada = posLead(l.status) >= 5;
        return '<tr class="clicavel' + (String(l.icp) === 'Sim' ? ' destaque' : '') +
            '" data-abre="' + esc(l.id) + '">' +
          '<td class="forte" style="max-width:190px">' + esc(l.lead || 'Sem nome') + '</td>' +
          '<td style="font-size:14px">' + (insta
              ? '<a href="' + esc(insta) + '" target="_blank" rel="noopener" data-paro="1">' + esc(l.contato) + '</a>'
              : (l.contato ? esc(l.contato) : '<span class="apagado">·</span>')) + '</td>' +
          '<td><span class="' + classeLead(l.status) + '">' + esc(l.status || 'Contato realizado') + '</span>' +
            (posLead(l.status) === 2 ? ' ' + medidorPortoes(l.portoes) : '') + '</td>' +
          '<td><span class="' + classeIcp(l.icp) + '">' + esc(l.icp || 'A confirmar') + '</span></td>' +
          '<td style="font-size:14px">' + (l.origem ? esc(l.origem) : '<span class="apagado">·</span>') + '</td>' +
          '<td style="font-size:14px">' + (l.tempo_mercado ? esc(l.tempo_mercado) : '<span class="apagado">·</span>') + '</td>' +

              ? brData(l.ultimo_contato, true) +
                (!fechada && dias > 14 ? ' <span class="pil pil-parado">há ' + dias + 'd</span>' : '')
              : '<span class="apagado">·</span>') + '</td>' +

            (l.proximo_passo ? esc(l.proximo_passo) : '<span class="apagado">·</span>') + '</td>' +

              ? '<a class="icone" href="' + esc(zap) + '" target="_blank" rel="noopener" ' +
                'data-paro="1" title="Abrir no WhatsApp">' + svg('zap',14) + '</a>'
              : '') + '</td></tr>';

  $('painel').innerHTML = h;
