      return '<div class="secao' + (aberta ? ' aberta' : '') + '" data-sec="tipo-' + esc(tid) + '">' +
        '<button class="secao-cab" type="button" data-toggle="tipo-' + esc(tid) + '">' +
          '<span class="secao-emo">' + esc(t.emoji || '') + '</span>' +
          '<span class="secao-meio"><span class="secao-nome">' + esc(t.nome || '') + '</span>' +
          '<span class="secao-res">' + esc(t.duracao || '') + '</span></span>' +
          '<span class="secao-cnt">' + plural(beats.length,'bloco','blocos') + '</span>' +
        '</button>' +
        '<div class="secao-corpo">' +
          (t.porque ? '<div class="secao-porque">' + esc(t.porque) + '</div>' : '') +
          (beats.length ? '<div class="ficha-rot" style="margin-top:12px">Os blocos de tempo</div>' +
            beats.map(function(b){
              return '<div class="beat"><div class="beat-t">' + esc(b.t || '') + '</div>' +
                '<div class="beat-o">' + (b.o || '') + '</div></div>';
            }).join('') : '') +
          (erros.length ? '<div class="ficha-rot" style="margin-top:14px">O que não fazer</div>' +
            erros.map(function(e){ return '<div class="erro-li">' + esc(e) + '</div>'; }).join('') : '') +
        '</div></div>';
    }).join('');

  ligarSecoes(cx);
}

/* ---- 11.4 ideias por nicho -------------------------------------------- */
function subNichos(cx){
  var nichos = bl('NICHOS');
  if (!nichos.length) {
    cx.innerHTML = '<div class="cartao"><div class="cartao-corpo"><div class="vazio">' +
      'Não encontrei os nichos na biblioteca.</div></div></div>';
    return;
  }

  cx.innerHTML = '<div class="cartao"><div class="cartao-topo"><div>' +
    '<div class="cartao-tit">Ideias por nicho</div>' +
    '<div class="cartao-sub">' + plural(nichos.length,'nicho','nichos') +
    '. Cada ideia já vem com o gancho pronto para falar.</div></div></div></div>' +
    nichos.map(function(n, i){
      var nid = n.id || String(i);
      var aberta = !!Estado.abertas['nicho-' + nid];
      var ideias = Array.isArray(n.ideias) ? n.ideias : [];

      return '<div class="secao' + (aberta ? ' aberta' : '') + '" data-sec="nicho-' + esc(nid) + '">' +
        '<button class="secao-cab" type="button" data-toggle="nicho-' + esc(nid) + '">' +
          '<span class="secao-emo">' + esc(n.emoji || '') + '</span>' +
          '<span class="secao-meio"><span class="secao-nome">' + esc(n.nome || '') + '</span>' +
          '<span class="secao-res">' + plural(ideias.length,'ideia','ideias') + ' com gancho</span></span>' +
        '</button>' +
        '<div class="secao-corpo">' +
          ideias.map(function(d){
            return '<div class="ideia"><div class="ideia-t">' + esc(d.t || '') + '</div>' +
              (d.gancho ? '<div class="ideia-g">' + esc(d.gancho) + '</div>' : '') + '</div>';
          }).join('') +
        '</div></div>';
    }).join('');

  ligarSecoes(cx);
}

/* ---- 11.5 revisar meu roteiro ----------------------------------------- */
function subRevisao(cx){
  var blocos = bl('REVISAO');

  var totalGeral = 0, feitosGeral = 0;
  blocos.forEach(function(b, i){
    var itens = Array.isArray(b.itens) ? b.itens : [];
    totalGeral += itens.length;
    itens.forEach(function(_, j){ if (Estado.marcados['rev:' + i + ':' + j]) feitosGeral++; });
  });

  var guardado = '';
  try { guardado = window.localStorage.getItem('roteiro_rascunho') || ''; } catch (e) {}

  var h = '<div class="cartao"><div class="cartao-topo"><div>' +
    '<div class="cartao-tit">Cole o seu roteiro aqui</div>' +
    '<div class="cartao-sub">Fica salvo só neste navegador, para você conferir item por item embaixo.</div>' +
    '</div></div><div class="cartao-corpo">' +
    '<textarea class="roteiro" id="txRoteiro" placeholder="Cole o roteiro que você escreveu...">' +
    esc(guardado) + '</textarea>' +
    '<div class="cartao-sub" id="contaRot" style="margin-top:8px"></div></div></div>';

  if (!blocos.length) {
    h += '<div class="cartao"><div class="cartao-corpo"><div class="vazio">' +
      'Não encontrei os blocos de revisão na biblioteca.</div></div></div>';
  } else {
    h += '<div class="cartao"><div class="cartao-corpo">' +
      '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">' +
      '<div style="flex:1;min-width:170px"><div class="cartao-tit">Revisão do roteiro</div>' +
      '<div class="cartao-sub">' + feitosGeral + ' de ' + totalGeral + ' conferidos</div></div>' +
      '<div style="font-weight:800;font-size:23px;letter-spacing:-.035em">' +
        (totalGeral > 0 ? Math.round(div(feitosGeral, totalGeral) * 100) : 0) + '%</div></div>' +
      '<div style="margin-top:11px">' + barra(feitosGeral, totalGeral) + '</div></div></div>';

    h += blocos.map(function(b, i){
      var itens = Array.isArray(b.itens) ? b.itens : [];
      var feitos = itens.filter(function(_, j){ return Estado.marcados['rev:' + i + ':' + j]; }).length;
      var aberta = Estado.abertas['rev-' + i] !== false;   /* a revisao comeca aberta */

      return '<div class="secao' + (aberta ? ' aberta' : '') + '" data-sec="rev-' + i + '">' +
        '<button class="secao-cab" type="button" data-toggle="rev-' + i + '">' +
          '<span class="secao-emo">' + esc(b.emoji || '') + '</span>' +
          '<span class="secao-meio"><span class="secao-nome">' + esc(b.bloco || '') + '</span></span>' +
          '<span class="secao-barra">' + barra(feitos, itens.length) + '</span>' +
          '<span class="secao-cnt">' + feitos + '/' + itens.length + '</span>' +
        '</button>' +
        '<div class="secao-corpo">' +
          itens.map(function(it, j){
            var chave = 'rev:' + i + ':' + j;
            var ok = !!Estado.marcados[chave];
            var idc = 'r-' + i + '-' + j;
            return '<div class="item' + (ok ? ' ok' : '') + '">' +
              '<input type="checkbox" id="' + idc + '" data-chave="' + esc(chave) + '"' + (ok ? ' checked' : '') + '>' +
              '<div><label class="item-t" for="' + idc + '">' + esc(it.t || '') + '</label>' +
              (it.d ? '<div class="item-d">' + esc(it.d) + '</div>' : '') + '</div></div>';
          }).join('') +
        '</div></div>';
    }).join('');
  }

  cx.innerHTML = h;

  /* o rascunho fica no navegador, nao ocupa o banco */
  var tx = $('txRoteiro');
  var conta = $('contaRot');
  function contar(){
    var t = tx.value.trim();
    var palavras = t ? t.split(/\s+/).length : 0;
    /* cerca de 150 palavras por minuto de fala */
    var seg = Math.round(div(palavras, 150) * 60);
    conta.textContent = palavras === 0
      ? 'Nenhuma palavra ainda.'
      : plural(palavras,'palavra','palavras') + ', mais ou menos ' + seg + ' segundos falando.';
  }
  contar();
  tx.addEventListener('input', function(){
    contar();
    try { window.localStorage.setItem('roteiro_rascunho', tx.value); } catch (e) {}
  });

  ligarSecoes(cx);
  ligarCaixas(cx, function(){ subRevisao(cx); });
}


/* ==========================================================================
   12. LIGAR TUDO
   ========================================================================== */

async function iniciar(){
  montarMenu();

  /* gaveta do celular */
  $('btnMenu').addEventListener('click', function(){ document.body.classList.toggle('gaveta'); });
  $('menuFundo').addEventListener('click', function(){ document.body.classList.remove('gaveta'); });

  /* sair */
  $('btnSair').addEventListener('click', async function(){
    this.disabled = true;
    try { await window.sb.auth.signOut(); } catch (e) {}
    location.replace('../login/');
  });

  /* fechar o modal clicando no fundo ou com Esc */
  $('modalFundo').addEventListener('click', function(ev){
    if (ev.target === $('modalFundo')) fecharModal();
  });
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape') fecharModal();
  });

  /* se a sessao cair enquanto voce usa, volta para o login */
  try {
    window.sb.auth.onAuthStateChange(function(evento, sessao){
      if (!sessao && evento !== 'INITIAL_SESSION') location.replace('../login/');
    });
  } catch (e) {}

  await carregarTudo();

  var inicial = (location.hash || '').replace('#','');
  irPara(ABAS.some(function(a){ return a.id === inicial; }) ? inicial : 'portfolio');
}

})();
</script>
