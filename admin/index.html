    b.addEventListener('click', function(){
      formLead(acharPorId(Estado.leads, b.getAttribute('data-abrelead')));
    });
  });
}

/* --------------------------------------------------------------------------
   IMPORTAR UMA LISTA DE LEADS DE UMA VEZ
   Serve para quando voce pesquisa corretoras e recebe uma lista pronta,
   em vez de digitar uma por uma.
   -------------------------------------------------------------------------- */
function telaImportar(){
  abrirModal({
    larga: true,
    titulo: 'Importar lista de leads',
    sub: 'Uma lead por linha. Pode colar de planilha ou de uma lista que você recebeu.',
    corpo:
      '<div class="erro-campo"></div>' +
      '<div class="campo"><label>Cole a lista aqui</label>' +
      '<textarea id="impTexto" class="alto" placeholder="Ana Lima; @analima_corretora; Instagram; 22 anos&#10;' +
      'Juliana Lopes; @juloppes; Indicação&#10;Tânia Moraes; @taniamoraes"></textarea>' +
      '<div class="dica">A ordem das colunas é: <b>nome, contato, origem, tempo de mercado, notas</b>. ' +
      'Só o nome é obrigatório. Separe por ponto e vírgula, vírgula ou tabulação. ' +
      'Quem já estiver no pipeline é ignorada sozinha.</div></div>' +
      htmlCampos([
        { k:'status', rot:'Todas entram com o status', tipo:'select', opcoes:LEAD_STATUS,
          padrao:'Contato realizado',
          dica:'Se você ainda não falou com elas, deixe o último contato em branco abaixo.' },
        { k:'icp', rot:'ICP', tipo:'select', opcoes:ICP, padrao:'A confirmar' },
        { k:'hoje', rot:'Marcar último contato como hoje', tipo:'liga',
          dica:'Ligue só se você já abordou essas leads hoje. Isso entra na contagem da meta.' }
      ], {}) +
      '<div id="impPrevia"></div>',
    pe: '<div class="espaco"></div>' +
        '<button class="btn" type="button" data-fechar="1">Cancelar</button>' +
        '<button class="btn btn-forte" type="button" data-importar="1" disabled>Importar</button>',
    depois: function(m){
      var tx = m.querySelector('#impTexto');
      var previa = m.querySelector('#impPrevia');
      var botao = m.querySelector('[data-importar]');
      var lote = { novas: [], repetidas: [] };

      function atualizar(){
        lote = lerListaColada(tx.value);
        var n = lote.novas.length, r = lote.repetidas.length;

        if (!n && !r) { previa.innerHTML = ''; botao.disabled = true; botao.textContent = 'Importar'; return; }

        botao.disabled = n === 0;
        botao.textContent = n ? 'Importar ' + plural(n,'lead','leads') : 'Nada novo para importar';

        var html = '<div class="resumo">' +
          '<div class="bom"><b>' + n + '</b> ' + (n === 1 ? 'lead nova' : 'leads novas') + '</div>' +
          (r ? '<div class="pulo"><b>' + r + '</b> já no pipeline, vão ser puladas</div>' : '') +
        '</div>';

        var mostrar = lote.novas.slice(0, 40);
        html += '<div class="previa"><table><thead><tr>' +
          '<th>Nome</th><th>Contato</th><th>Origem</th><th>Tempo de mercado</th>' +
          '</tr></thead><tbody>' +
          mostrar.map(function(x){
            return '<tr><td class="forte">' + esc(x.lead) + '</td>' +
              '<td>' + (x.contato ? esc(x.contato) : '<span class="apagado">·</span>') + '</td>' +
              '<td>' + (x.origem ? esc(x.origem) : '<span class="apagado">·</span>') + '</td>' +
              '<td>' + (x.tempo_mercado ? esc(x.tempo_mercado) : '<span class="apagado">·</span>') + '</td></tr>';
          }).join('') +
          lote.repetidas.slice(0, 10).map(function(x){
            return '<tr class="repetida"><td>' + esc(x.lead) + '</td>' +
              '<td colspan="3">já está no pipeline</td></tr>';
          }).join('') +
          '</tbody></table></div>' +
          (lote.novas.length > 40
            ? '<div class="cartao-sub" style="margin-top:8px">Mostrando as 40 primeiras. ' +
              'Vão entrar todas as ' + lote.novas.length + '.</div>' : '');

        previa.innerHTML = html;
      }

      tx.addEventListener('input', atualizar);
      tx.focus();

      botao.addEventListener('click', async function(){
        if (!lote.novas.length) return;
        var opc = lerCampos(m);
        botao.disabled = true;
        botao.textContent = 'Importando...';

        var prontas = lote.novas.map(function(x){
          return {
            lead: x.lead, contato: x.contato, notas: x.notas,
            origem: x.origem, tempo_mercado: x.tempo_mercado,
            status: opc.status || 'Contato realizado',
            icp: opc.icp || 'A confirmar',
            primeiro_contato: hojeS(),
            ultimo_contato: opc.hoje ? hojeS() : null,
            portoes: []
          };
        });

        var ok = await gravar('leads', function(t){ return t.insert(prontas); });
        if (!ok) { botao.disabled = false; botao.textContent = 'Importar'; return; }

        fecharModal();
        toast(plural(prontas.length,'lead importada','leads importadas') + '.');
        await carregarTudo();
        desenhar();
      });
    }
  });
}

function formLead(l){
  /* se ja existe cliente ligado a esta lead, nao oferece converter de novo */
  var jaVirou = l && Estado.clientes.some(function(c){ return String(c.lead_id) === String(l.id); });

  formPadrao({
    titulo: l ? 'Editar lead' : 'Nova lead',
    sub: l ? (l.lead || '') : 'Uma conversa nova no pipeline',
    larga: true,
    tabela:'leads',
    id: l ? l.id : null,
    botaoExtra: (l && !jaVirou)
      ? '<button class="btn" type="button" data-virou="1">' + svg('clientes',13) + ' Virou cliente</button>'
      : '',
    depoisDeMontar: function(m){
      var bv = m.querySelector('[data-virou]');

/* agrupa o faturamento por mes de pagamento, do mais antigo para o mais novo */
function porMes(clientes){
  var m = {};
  clientes.forEach(function(c){
    if (!c || !c.data_pagamento) return;
    var k = String(c.data_pagamento).slice(0, 7);      /* AAAA-MM */
    if (!m[k]) m[k] = { chave:k, total:0, n:0 };
    m[k].total += num(c.valor);
    m[k].n += 1;
  });
  var fora = Object.keys(m).sort();
  return fora.map(function(k, i){
    var x = m[k];
    var ant = i > 0 ? m[fora[i-1]].total : null;
    /* variacao so existe se houve mes anterior com valor, senao fica nula */
    x.variacao = (ant && ant > 0) ? Math.round(div(x.total - ant, ant) * 100) : null;
    return x;
  });
}
function nomeMes(chave){
  var p = String(chave).split('-');
  var i = num(p[1]) - 1;
  return (MESES[i] ? capital(MESES[i]) : chave) + ' de ' + p[0];
}

/* junta o que a lead ja sabia, para a ficha do cliente nao nascer vazia */
function historicoDaLead(l){
  var p = [];
  var cab = [];
  if (l.origem) cab.push('Origem: ' + l.origem);
  if (l.tempo_mercado) cab.push('Tempo de mercado: ' + l.tempo_mercado);
  if (cab.length) p.push(cab.join('. ') + '.');
  if (l.frase_real) p.push('O que ela disse:\n"' + l.frase_real + '"');
  if (l.notas) p.push('Do pipeline:\n' + l.notas);
  return p.join('\n\n');
}

   O conteudo vem do arquivo js/mensagens.js, que espelha a sua pagina

function M(){ return window.Mensagens || { momentos:[], itens:[] }; }

/* acha os campos variaveis de um texto, tipo [NOME] ou [LINK DO PLANO] */
function variaveisDe(txt){
  var achados = String(txt || '').match(/\[[A-ZÀ-Ú0-9 ÇÃÕÊÁÉÍÓÚÂÔ\/]+\]/g) || [];
  var unicas = [];
  achados.forEach(function(v){ if (unicas.indexOf(v) < 0) unicas.push(v); });
  return unicas;
}
/* troca os campos preenchidos pelo que voce digitou */
function preencher(txt, valores){
  var fora = String(txt || '');
  variaveisDe(fora).forEach(function(v){
    var val = (valores && valores[v] ? String(valores[v]).trim() : '');
    if (val) fora = fora.split(v).join(val);
  });
  return fora;
}
/* marca os campos ainda vazios, para dar para ver o que falta */
function destacarVars(txt){
  return esc(txt).replace(/\[[A-ZÀ-Ú0-9 ÇÃÕÊÁÉÍÓÚÂÔ\/]+\]/g, function(m){
    return '<mark>' + m + '</mark>';
  });
}

async function copiarTexto(txt){
  try {
    await navigator.clipboard.writeText(txt);
    return true;
  } catch (e) {
    /* alguns navegadores so deixam copiar de um campo de verdade */
    try {
      var t = document.createElement('textarea');
      t.value = txt;
      t.style.position = 'fixed';
      t.style.opacity = '0';
      document.body.appendChild(t);
      t.select();
      var ok = document.execCommand('copy');
      t.remove();
      return ok;
    } catch (e2) { return false; }
  }
}

    $('painel').innerHTML = '<div class="cartao"><div class="cartao-corpo"><div class="vazio">' +
      'O arquivo <b>js/mensagens.js</b> não carregou, então a biblioteca está vazia. ' +
      'Confira se ele está na pasta js do projeto e recarregue a página.</div></div></div>';
    return;
  }

  var lista = dados.itens.filter(function(m){
    if (Estado.msMomento !== 'todas' && m.momento !== Estado.msMomento) return false;
    if (!busca) return true;
    return [m.titulo, m.quando, m.principio, m.texto].some(function(x){
      return String(x || '').toLowerCase().indexOf(busca) > -1;
    });
  });

  var mom = dados.momentos.filter(function(x){ return x.id === Estado.msMomento; })[0];

  var h = '<div class="cartao"><div class="ferramentas">' +
    '<div class="abas">' +
      dados.momentos.map(function(x){
        var n = dados.itens.filter(function(m){ return m.momento === x.id; }).length;
        return '<button class="aba' + (Estado.msMomento === x.id ? ' on' : '') +
          '" type="button" data-mom="' + esc(x.id) + '">' + esc(x.nome) +
          ' <span class="apagado">' + n + '</span></button>';
      }).join('') +
      '<button class="aba' + (Estado.msMomento === 'todas' ? ' on' : '') +
        '" type="button" data-mom="todas">Todas <span class="apagado">' +
        dados.itens.length + '</span></button>' +
    '</div>' +
    '<div class="busca">' + svg('busca',14) +
      '<input id="msBusca" type="search" placeholder="Buscar na mensagem" value="' +
      esc(Estado.msBusca) + '"></div>' +
  '</div>' +
  (mom ? '<div class="cartao-topo" style="border-bottom:none">' +
         '<div class="cartao-sub">' + esc(mom.dica) + '</div></div>' : '') +
  '</div>';

  if (!lista.length) {
    h += '<div class="vazio">Nenhuma mensagem com essa busca. Tente outra palavra ou volte para <b>Todas</b>.</div>';
  } else {
    h += lista.map(function(m, i){
      var vars = variaveisDe(m.texto);
      return '<div class="msg" data-i="' + i + '">' +
        '<div class="msg-cab">' +
          '<div class="msg-tit">' + esc(m.titulo) + '</div>' +
          (m.quando ? '<div class="msg-quando">' + esc(m.quando) + '</div>' : '') +
        '</div>' +
        (m.principio ? '<div class="msg-princ">' + esc(m.principio) + '</div>' : '') +
        '<div class="msg-corpo">' +
          '<div class="msg-txt" data-txt="' + i + '">' + destacarVars(m.texto) + '</div>' +
          '<div class="msg-pe">' +
            '<div class="msg-vars">' + vars.map(function(v){
              return '<label class="msg-var"><span>' + esc(v.replace(/[\[\]]/g,'')) + '</span>' +
                '<input type="text" data-var="' + esc(v) + '" data-para="' + i + '" value="' +
                esc(Estado.msCampos[v] || '') + '" placeholder="preencher"></label>';
            }).join('') + '</div>' +
            '<button class="btn btn-forte" type="button" data-copiar="' + i + '">' +
              svg('colar',13) + ' Copiar</button>' +
          '</div>' +
          (m.nao && m.nao.length ? '<div class="msg-nao"><b>Não fazer</b>' +
            m.nao.map(function(x){ return '<div>' + esc(x) + '</div>'; }).join('') + '</div>' : '') +
          (m.dica ? '<div class="msg-dica">' + esc(m.dica) + '</div>' : '') +
        '</div></div>';
    }).join('');
  }

  $('painel').innerHTML = h;

  $('painel').querySelectorAll('[data-mom]').forEach(function(b){
    b.addEventListener('click', function(){ Estado.msMomento = b.getAttribute('data-mom'); telaMensagens(); });
  });
  ligarBusca('msBusca', 'msBusca', telaMensagens);

  /* preencher um campo atualiza o texto na hora, sem recarregar a aba */
  $('painel').querySelectorAll('[data-var]').forEach(function(inp){
    inp.addEventListener('input', function(){
      Estado.msCampos[inp.getAttribute('data-var')] = inp.value;
      var i = inp.getAttribute('data-para');
      var cx = $('painel').querySelector('[data-txt="' + i + '"]');
      if (cx) cx.innerHTML = destacarVars(preencher(lista[num(i)].texto, Estado.msCampos));
      /* o mesmo campo em outras mensagens acompanha */
      $('painel').querySelectorAll('[data-var="' + inp.getAttribute('data-var') + '"]').forEach(function(o){
        if (o !== inp) o.value = inp.value;
      });
    });
  });

  $('painel').querySelectorAll('[data-copiar]').forEach(function(b){
    b.addEventListener('click', async function(){
      var m = lista[num(b.getAttribute('data-copiar'))];
      var txt = preencher(m.texto, Estado.msCampos);
      var faltam = variaveisDe(txt);
      var ok = await copiarTexto(txt);
      if (!ok) { toast('Não consegui copiar. Selecione o texto e use Cmd+C.'); return; }
      toast(faltam.length
        ? 'Copiado, mas faltou preencher ' + faltam.join(', ')
        : 'Copiado. É só colar no WhatsApp.');
    });
  });
}


/* ==========================================================================
   14. LIGAR TUDO
   ========================================================================== */

async function iniciar(){
  montarMenu();

  $('btnMenu').addEventListener('click', function(){ document.body.classList.toggle('gaveta'); });
  $('menuFundo').addEventListener('click', function(){ document.body.classList.remove('gaveta'); });

  $('btnSair').addEventListener('click', async function(){
    this.disabled = true;
    try { await window.sb.auth.signOut(); } catch (e) {}
    location.replace('../login/');
  });

  $('modalFundo').addEventListener('click', function(ev){
    if (ev.target === $('modalFundo')) fecharModal();
  });
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape') fecharModal();
  });

  /* se a sessao cair enquanto voce usa, volta para o login */
  try {
    window.sb.auth.onAuthStateChange(function(evento, sessao){
      if (!sessao && evento !== 'INITIAL_SESSION') location.replace('../login/');
    });
  } catch (e) {}

  await carregarTudo();

  var inicial = (location.hash || '').replace('#','');
  irPara(ABAS.some(function(a){ return a.id === inicial; }) ? inicial : 'pautas');
}

})();
</script>
